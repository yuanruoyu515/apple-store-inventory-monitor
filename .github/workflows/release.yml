name: 美加阿版 macOS Release

on:
  push:
    tags: ["v*-us.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: international-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: international-${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - name: Verify reproducible region data and release version
        run: |
          pnpm generate:regions
          git diff --exit-code -- crates/apw-core/data
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION=$(node -p "require('./package.json').version")
            [[ "$GITHUB_REF_NAME" == "v${VERSION}-us."* ]]
          fi
      - name: Validate
        run: |
          cargo fmt --all --check
          pnpm test
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and verify signed application bundle
        run: |
          pnpm tauri build --bundles app
          APP="target/release/bundle/macos/Apple Store Inventory Monitor US.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p release-assets
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Apple-Store-Inventory-Monitor-US-macOS-${{ matrix.arch }}-${VERSION}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: international-macos-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: international-macos-*
          path: build-input
          merge-multiple: true
      - name: Create universal drag-to-Applications DMG
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          ditto -x -k "build-input/Apple-Store-Inventory-Monitor-US-macOS-arm64-${VERSION}.zip" build-input/arm64
          ditto -x -k "build-input/Apple-Store-Inventory-Monitor-US-macOS-Intel-${VERSION}.zip" build-input/Intel
          python3 -m venv .dmg-venv
          .dmg-venv/bin/pip install dmgbuild==1.6.7
          .dmg-venv/bin/python scripts/package-universal-dmg.py --arm-app "build-input/arm64/Apple Store Inventory Monitor US.app" --intel-app "build-input/Intel/Apple Store Inventory Monitor US.app" --output "release-assets/Apple-Store-Inventory-Monitor-US-macOS-universal-${VERSION}.dmg"
      - name: Prepare source and checksums
        run: |
          cp docs/releases/${GITHUB_REF_NAME}.md release-assets/RELEASE-NOTES.md
          git archive --format=zip --prefix=apple-store-inventory-monitor/ -o release-assets/Source-${GITHUB_REF_NAME}.zip HEAD
          cd release-assets
          shasum -a 256 *.dmg *.zip RELEASE-NOTES.md > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "果到雷达 · 美加阿版 ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
